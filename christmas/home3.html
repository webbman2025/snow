<script>
  let lang = "en";
  let hasPetButtonRun = false;

  function generatePetButton() {
    // Ensure only run one time
    if (hasPetButtonRun) return;
    hasPetButtonRun = true;

    // 1. Injecting CSS Animation Styles into the Head
    const styleTag = document.createElement("style");
    styleTag.innerHTML = `
            @keyframes slideFromBehindDog {
                from {
                    opacity: 0;
                    transform: translateY(100px); /* Start hidden down at the dog's bottom */
                }
                to {
                    opacity: 1;
                    transform: translateY(0);    /* Slide up to its resting absolute position */
                }
            }

            /* 🐕 Dog Shake Animation */
            @keyframes slideDogFromLeft {
                from {
                    opacity: 0;
                    transform: translateX(-100px); /* Start hidden down at the dog's bottom */
                }
                to {
                    opacity: 1;
                    transform: translate(0);    /* Slide up to its resting absolute position */
                }
            }

            @keyframes shakeDog {
                0%, 50%, 100% { transform: rotate(0deg) translateX(0); }
                25% { transform: rotate(-15deg) translateX(-2px); }
                75% { transform: rotate(8deg) translateX(0); }
            }

            /* Smooth scaling handling for the widget container on hover */
            .widget-container {
                transition: transform 0.3s ease !important;
            }
            .widget-container:hover {
                transform: scale(1.03);
            }
        `;
    document.head.appendChild(styleTag);

    const url = lang === 'en' ? "https://web.three.com.hk/plans/vipet/index-en.html?intcmp=home-dog-260522" : "https://web.three.com.hk/plans/vipet/index.html?intcmp=home-dog-260522"

    // 2. Configuration with your specific assets
    const buttonConfig = {
      left: {
        url,
        img: "https://www.three.com.hk/assets/images/dog-left.png",
        message:
          "https://www.three.com.hk/assets/images/message-left-en.png",
      },
      center: {
        url,
        img: "https://www.three.com.hk/assets/images/dog-center.png",
        message:
          "https://www.three.com.hk/assets/images/message-center-en.png",
      },
    };

    // 3. Selection
    const positions = Object.keys(buttonConfig);
    let choice = positions[Math.floor(Math.random() * positions.length)];

    // Please do not remove or delete!
    // choice = 'left';
    // choice = 'center';

    const settings = buttonConfig[choice];
    const isMobile = window.innerWidth <= 768;

    // 4. Create Container
    const widgetContainer = document.createElement("div");
    widgetContainer.className = "widget-container"; // Assigned class for CSS hover targeting

    // 5. Create Elements
    const btn = document.createElement("button");
    btn.innerHTML = `<img src="${settings.img}" alt="Pet" style="width: 100%; height: auto; display: block;">`;

    const message = document.createElement("div");
    message.innerHTML = `<img src="${settings.message}" alt="Pet Plan Bubble Message" style="width: 100%; height: auto; display: block;">`;

    // 6. Responsive Width Logic
    let btnWidth;
    if (choice === "left") {
      btnWidth = isMobile ? "134px" : "134px";
    } else if (choice === "center") {
      btnWidth = isMobile ? "159px" : "159px";
    } else {
      btnWidth = isMobile ? "200px" : "300px";
    }

    // 7. Core Styles on Container (Acts as the absolute anchor)
    Object.assign(widgetContainer.style, {
      position: "fixed",
      bottom: "0",
      width: btnWidth,
      zIndex: "9999",
    });

    // Horizontal Positioning
    if (choice === "left") {
      widgetContainer.style.left = "0px";
    } else if (choice === "center") {
      widgetContainer.style.left = "0";
      widgetContainer.style.right = "0";
      widgetContainer.style.margin = "0 auto";
    } else {
      widgetContainer.style.right = "20px";
    }

    // Button Styles (Sits normally at the bottom of the container)
    Object.assign(btn.style, {
      width: "100%",
      background: "transparent",
      border: "none",
      padding: "0",
      cursor: "pointer",
      outline: "none",
      position: "relative",
      zIndex: "2", // Sits on top of the message while it slides up
    });

    // Message Bubble Styles
    Object.assign(message.style, {
      opacity: "0",
      position: "absolute",
      width: "100%", // Inherits container width match
      transition: "transform 0.3s ease",
      pointerEvents: "pointer",
      zIndex: "1", // Hidden behind dog graphic layers initially
    });

    // --- Fixed horizontal adjustment for the 'left' layout choice ---
    if (choice === "left") {
      // Dog slides in from left + fades in for 0.8s
      btn.style.animation = "slideDogFromLeft 0.8s ease-in-out forwards";
      message.style.left = "80px"; // Changed from right = '-80px' to consistently push it rightward

      // Message Bubble Styles
      Object.assign(message.style, {
        width: "250px",
        bottom: "80%", // Sits above the dog vertically in its resting state
      });

      // Listen for slide animation to complete, then start shake
      btn.addEventListener("animationend", function handleSlideComplete(e) {
        if (e.animationName === "slideDogFromLeft") {
          btn.removeEventListener("animationend", handleSlideComplete);
          btn.style.animation = "none";
          void btn.offsetWidth; // Force reflow
          btn.style.animation = "shakeDog .3s ease-in-out forwards";

          // Listen for shake animation to complete, then start message animation
          btn.addEventListener("animationend", function handleShakeComplete(e) {
            if (e.animationName === "shakeDog") {
              btn.removeEventListener("animationend", handleShakeComplete);
              message.style.animation =
                "slideFromBehindDog 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards";
            }
          });
        }
      });
    } else if (choice === "center") {
      // Dog slides in from bottom + fades in for 0.8s
      btn.style.animation = "slideFromBehindDog 0.8s ease-in-out forwards";
      message.style.left = "0";

      // Vertically align message and dog for center choice
      Object.assign(widgetContainer.style, {
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        justifyContent: "flex-end",
      });

      Object.assign(message.style, {
        position: "static",
        width: "327px",
        bottom: "auto",
        marginTop: "0",
        marginBottom: "-30px",
        textAlign: "center",
      });

      // Listen for slide animation to complete, then start shake
      btn.addEventListener("animationend", function handleSlideComplete(e) {
        if (e.animationName === "slideFromBehindDog") {
          btn.removeEventListener("animationend", handleSlideComplete);
          btn.style.animation = "none";
          void btn.offsetWidth; // Force reflow
          btn.style.animation = "shakeDog .3s ease-in-out forwards";

          // Listen for shake animation to complete, then start message animation
          btn.addEventListener("animationend", function handleShakeComplete(e) {
            if (e.animationName === "shakeDog") {
              btn.removeEventListener("animationend", handleShakeComplete);
              message.style.animation =
                "slideFromBehindDog 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards";
            }
          });
        }
      });
    } else {
      message.style.left = "0"; // Default fallback centering for non-left choice layouts
    }

    // 8. Interaction Logic (Hover Bubble Push)
    if (!isMobile) {
      widgetContainer.onmouseover = () => {
        message.style.transform = "translateY(-10px)"; // Lifts the text bubble slightly on hover
      };
      widgetContainer.onmouseout = () => {
        message.style.transform = "translateY(0)";
      };
    }

    // 9. Open Link & Mount
    widgetContainer.onclick = () => window.open(settings.url, "_blank");
    widgetContainer.style.cursor = "pointer";

    // Append items
    if (choice === "center") {
      // For center: append message first so it appears above the dog
      widgetContainer.appendChild(message);
      widgetContainer.appendChild(btn);
    } else {
      // For left/right: append button first
      widgetContainer.appendChild(btn);
      widgetContainer.appendChild(message);
    }
    document.body.appendChild(widgetContainer);
  }

  function watchForUnmount(selector, callback, options = {}) {
    const { root = document.body } = options;

    let element = document.querySelector(selector);
    if (!element) {
      console.warn(`Element ${selector} not found`);
      return () => {};
    }

    let hasCalled = false; // ← Prevents duplicate calls

    const observer = new MutationObserver(() => {
      if (hasCalled) return;

      if (!document.contains(element)) {
        hasCalled = true;
        observer.disconnect();
        callback(element);
      }
    });

    observer.observe(root, {
      childList: true,
      subtree: true,
    });

    // Optional: One-time final safety check
    const safetyCheck = setTimeout(() => {
      if (!hasCalled && !document.contains(element)) {
        hasCalled = true;
        observer.disconnect();
        callback(element);
      }
    }, 1000);

    // Cleanup function
    return () => {
      hasCalled = true;
      observer.disconnect();
      clearTimeout(safetyCheck);
    };
  }
